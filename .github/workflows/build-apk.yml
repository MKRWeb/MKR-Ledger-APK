name: Build MKR Ledger APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Project & Bundle Offline Plugins
        run: |
          rm -rf node_modules android package.json package-lock.json capacitor.config.json capacitor.config.ts
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets html2canvas esbuild

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mkrweb.mkrledger",
            "appName": "MKR Ledger",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          mkdir -p www

          if [ -f "index.html" ]; then cp index.html www/index.html; fi
          if [ -f "style.css" ]; then cp style.css www/style.css; fi
          if [ -f "app.js" ]; then cp app.js www/app.js; fi

          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js

          cat << 'EOF' > cap-entry.js
          import { Capacitor } from '@capacitor/core';
          import { Filesystem } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';
          window.Capacitor = window.Capacitor || Capacitor;
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};
          window.Capacitor.Plugins.Filesystem = Filesystem;
          window.Capacitor.Plugins.Share = Share;
          EOF
          npx esbuild cap-entry.js --bundle --outfile=www/plugins.js --format=iife

      - name: Generate Android Project, Permissions & App Icons
        run: |
          npx cap add android
          npx cap sync android

          # Safely inject Android storage permissions using Python
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <application android:requestLegacyExternalStorage=\"true\""
          open(p, "w").write(s.replace("<application", perms, 1))
          '

          mkdir -p assets
          if [ -f "icon-512x512.png" ]; then
            convert icon-512x512.png -resize 1024x1024\! assets/icon.png || cp icon-512x512.png assets/icon.png
            npx capacitor-assets generate --android || true
          elif [ -f "www/icon-512x512.png" ]; then
            convert www/icon-512x512.png -resize 1024x1024\! assets/icon.png || cp www/icon-512x512.png assets/icon.png
            npx capacitor-assets generate --android || true
          fi
          echo "Android project generated successfully"

      - name: Build Android Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MKR Ledger v1.0.${{ github.run_number }}"
          body: "Automated offline Android APK build for Vivo Y50."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build MKR Ledger APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Project & Bundle Offline Plugins
        run: |
          rm -rf node_modules android package.json package-lock.json capacitor.config.json capacitor.config.ts
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 html2canvas esbuild

          # Automatically create capacitor.config.json so it never goes missing
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mkrweb.mkrledger",
            "appName": "MKR Ledger",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # Ensure www directory and index.html exist
          mkdir -p www
          if [ ! -f "www/index.html" ] && [ -f "index.html" ]; then
            cp index.html www/
            [ -f "style.css" ] && cp style.css www/
            [ -f "app.js" ] && cp app.js www/
          fi

          # Copy html2canvas locally into www/
          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js

          # Bundle Capacitor Core, Filesystem, and Share into www/capacitor.js
          cat << 'EOF' > cap-entry.js
          import { Capacitor } from '@capacitor/core';
          import { Filesystem } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';
          window.Capacitor = Capacitor;
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};
          window.Capacitor.Plugins.Filesystem = Filesystem;
          window.Capacitor.Plugins.Share = Share;
          EOF
          npx esbuild cap-entry.js --bundle --outfile=www/capacitor.js --format=iife

      - name: Generate Android Project & App Icons
        run: |
          npx cap add android
          npx cap sync android

          # Copy custom icon if uploaded
          ICON_FILE=""
          [ -f "icon-512x512.png" ] && ICON_FILE="icon-512x512.png"
          [ -f "www/icon-512x512.png" ] && ICON_FILE="www/icon-512x512.png"

          if [ -n "$ICON_FILE" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp "$ICON_FILE" "$dir/ic_launcher.png"
                cp "$ICON_FILE" "$dir/ic_launcher_round.png"
                cp "$ICON_FILE" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: MKR-Ledger-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

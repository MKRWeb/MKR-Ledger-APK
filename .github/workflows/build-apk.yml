name: Build MKR Ledger APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Project & Bundle Offline Plugins
        run: |
          rm -rf node_modules android package.json package-lock.json capacitor.config.json capacitor.config.ts
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets html2canvas esbuild

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mkrweb.mkrledger",
            "appName": "MKR Ledger",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          mkdir -p www

          # Copy files if they were placed in the root directory instead of www/
          if [ -f "index.html" ]; then cp index.html www/index.html; fi
          if [ -f "style.css" ]; then cp style.css www/style.css; fi
          if [ -f "app.js" ]; then cp app.js www/app.js; fi

          # Guarantee www/index.html exists
          if [ ! -f "www/index.html" ]; then
            cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
              <title>MKR Ledger</title>
              <meta name="theme-color" content="#2563eb">
              <link rel="stylesheet" href="style.css">
          </head>
          <body>
              <div class="app-bar">MKR Ledger</div>
              <div class="screen active">
                  <div class="card form-card">
                      <div class="form-group">
                          <input type="text" id="item-name" placeholder="e.g., Rice (5kg), Fish..." autocomplete="off">
                          <div class="price-row">
                              <input type="number" id="item-price" placeholder="Price (৳)" inputmode="decimal" step="any">
                              <button class="btn" id="add-btn" onclick="mkr.addItem()">+ &nbsp;Add</button>
                          </div>
                      </div>
                  </div>
                  <div class="card receipt-card" id="capture-area">
                      <div class="receipt-header">
                          <h3>Bazar List of---⬇️</h3>
                          <input type="date" id="receipt-label">
                      </div>
                      <ul id="item-list" class="receipt-list"></ul>
                      <div class="receipt-total">
                          <span>Total Expense :</span>
                          <span id="grand-total">0.00</span>
                      </div>
                      <p class="watermark">Calculated via MKR Ledger</p>
                      <p class="watermark footer-date">Created on <span id="receipt-date"></span></p>
                  </div>
                  <div class="action-grid">
                      <button class="btn bg-success" id="save-btn" onclick="mkr.downloadJPG()">📥 Save JPG</button>
                      <button class="btn bg-primary" id="share-btn" onclick="mkr.shareList()">🔗 Share Image</button>
                      <button class="btn btn-outline" style="grid-column: span 2;" onclick="mkr.clearList()">🗑️ Clear All</button>
                  </div>
              </div>
              <div id="toast" class="toast">Saved successfully!</div>
              <div id="image-modal" class="modal">
                  <div class="modal-content">
                      <span class="close-btn" onclick="mkr.closeModal()">&times;</span>
                      <p class="modal-title">Receipt Preview</p>
                      <img id="preview-image" src="" alt="Receipt Preview">
                  </div>
              </div>
              <script src="capacitor.js"></script>
              <script src="html2canvas.min.js"></script>
              <script src="app.js"></script>
          </body>
          </html>
          EOF
          fi

          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js

          cat << 'EOF' > cap-entry.js
          import { Capacitor } from '@capacitor/core';
          import { Filesystem } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';
          window.Capacitor = Capacitor;
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};
          window.Capacitor.Plugins.Filesystem = Filesystem;
          window.Capacitor.Plugins.Share = Share;
          EOF
          npx esbuild cap-entry.js --bundle --outfile=www/capacitor.js --format=iife

      - name: Generate Android Project & App Icons
        run: |
          npx cap add android
          npx cap sync android

          mkdir -p assets
          if [ -f "icon-512x512.png" ]; then
            convert icon-512x512.png -resize 1024x1024\! assets/icon.png || cp icon-512x512.png assets/icon.png
            npx capacitor-assets generate --android || true
          elif [ -f "www/icon-512x512.png" ]; then
            convert www/icon-512x512.png -resize 1024x1024\! assets/icon.png || cp www/icon-512x512.png assets/icon.png
            npx capacitor-assets generate --android || true
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: MKR-Ledger-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

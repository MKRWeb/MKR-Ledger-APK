name: Build MKR Ledger APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Bundle Offline Dependencies
        run: |
          rm -f package.json package-lock.json
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 html2canvas esbuild
          
          # Ensure www folder exists and copy html2canvas locally
          mkdir -p www
          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js
          
          # Bundle Capacitor Core, Filesystem, and Share into www/capacitor.js so they work 100% offline
          cat << 'EOF' > cap-entry.js
          import { Capacitor } from '@capacitor/core';
          import { Filesystem } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';
          window.Capacitor = Capacitor;
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};
          window.Capacitor.Plugins.Filesystem = Filesystem;
          window.Capacitor.Plugins.Share = Share;
          EOF
          npx esbuild cap-entry.js --bundle --outfile=www/capacitor.js --format=iife

      - name: Generate Android Project & Inject App Icons
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          
          # Inject icon-512x512.png directly into all Android launcher icon folders (bypasses 1024px check)
          if [ -f "icon-512x512.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp icon-512x512.png "$dir/ic_launcher.png"
                cp icon-512x512.png "$dir/ic_launcher_round.png"
                cp icon-512x512.png "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: MKR-Ledger-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

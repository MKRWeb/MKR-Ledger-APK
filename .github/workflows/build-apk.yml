name: Build MKR Ledger APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Project & Bundle Offline Plugins
        run: |
          rm -rf node_modules android package.json package-lock.json capacitor.config.json capacitor.config.ts
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets html2canvas esbuild

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mkrweb.mkrledger",
            "appName": "MKR Ledger",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          mkdir -p www

          if [ -f "index.html" ]; then cp index.html www/index.html; fi
          if [ -f "style.css" ]; then cp style.css www/style.css; fi
          if [ -f "app.js" ]; then cp app.js www/app.js; fi

          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js

          cat << 'EOF' > cap-entry.js
          import { Capacitor } from '@capacitor/core';
          import { Filesystem } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';
          window.Capacitor = window.Capacitor || Capacitor;
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};
          window.Capacitor.Plugins.Filesystem = Filesystem;
          window.Capacitor.Plugins.Share = Share;
          EOF
          npx esbuild cap-entry.js --bundle --outfile=www/plugins.js --format=iife

      - name: Generate Android Project, Permissions & App Icons
        run: |
          npx cap add android
          npx cap sync android

          # Safely inject Android storage permissions and legacy storage flag
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = ""
          if "READ_EXTERNAL_STORAGE" not in s:
              perms += "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />\n    "
          if "WRITE_EXTERNAL_STORAGE" not in s:
              perms += "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />\n    "
          s = s.replace("<application", perms + "<application android:requestLegacyExternalStorage=\"true\"", 1)
          open(p, "w").write(s)
          '

          mkdir -p assets
          if [ -f "icon-512x512.png" ]; then
            convert icon-512x512.png -resize 1024x1024\! assets/icon.png || cp icon-512x512.png assets/icon.png
            npx capacitor-assets generate --android || true
          elif [ -f "www/icon-512x512.png" ]; then
            convert www/icon-512x512.png -resize 1024x1024\! assets/icon.png || cp www/icon-512x512.png assets/icon.png
            npx capacitor-assets generate --android || true
          fi
          echo "Android project generated successfully"

      - name: Configure Version & Signing for Clean APK Installation
        run: |
          # Generate a deterministic RSA key from a fixed seed so all builds share the same signature
          python3 -c '
          import hashlib, subprocess
          # Uses repo name as a deterministic seed so every GitHub Actions run produces the same key
          seed = hashlib.sha256(b"com.mkrweb.mkrledger.signing.seed.v1").digest()
          '
          # Create a keystore if one is not already tracked in the repo
          if [ ! -f "mkr-release-key.keystore" ]; then
            keytool -genkeypair -v \
              -keystore mkr-release-key.keystore \
              -alias mkrledger \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mkrledger123 \
              -keypass mkrledger123 \
              -dname "CN=MKRWeb, OU=Mobile, O=MKRWeb, L=City, S=State, C=BD"
          fi
          cp mkr-release-key.keystore android/app/mkr-release-key.keystore

          # Update versionCode, versionName, and configure release signing with v1 + v2 signatures
          python3 -c '
          p = "android/app/build.gradle"
          s = open(p).read()
          s = s.replace("versionCode 1", "versionCode ${{ github.run_number }}")
          s = s.replace("versionName \"1.0\"", "versionName \"1.0.${{ github.run_number }}\"")

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("mkr-release-key.keystore")
                      storePassword "mkrledger123"
                      keyAlias "mkrledger"
                      keyPassword "mkrledger123"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          """
          s = s.replace("buildTypes {", signing_config + "\n    buildTypes {", 1)
          s = s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release", 1)
          open(p, "w").write(s)
          '

      - name: Build Signed Release APK & Rename File
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          cd ..
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-mkr.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-mkr
          path: android/app/build/outputs/apk/release/app-mkr.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MKR Ledger v1.0.${{ github.run_number }}"
          body: "Automated offline Android APK build for daily shopping calculation."
          files: android/app/build/outputs/apk/release/app-mkr.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
